{% extends 'base.html' %}

{% block content %}
<h2>All Posts</h2>

{% for post in posts %}
  <h3><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></h3>
  <p>By {{ post.author }} on {{ post.created_at }}</p>
  <hr>
{% endfor %}

{% if user.is_authenticated %}
  <a href="{% url 'post-create' %}">Create new post</a>
{% endif %}
{% endblock %}
