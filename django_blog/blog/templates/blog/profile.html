<!-- templates/accounts/profile.html -->
{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2>Your Profile</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <fieldset>
    <legend>Account</legend>
    {{ user_form.as_p }}
  </fieldset>

  {% if profile_form %}
  <fieldset>
    <legend>Profile</legend>
    {{ profile_form.as_p }}
    {% if request.user.profile.avatar %}
      <img src="{{ request.user.profile.avatar.url }}" alt="avatar" width="120">
    {% endif %}
  </fieldset>
  {% endif %}

  <button type="submit">Update Profile</button>
</form>
{% endblock %}
